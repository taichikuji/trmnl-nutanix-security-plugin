---
name: Nutanix Security
# Short descriptions for TRMNL's private plugin editor.
description: Advisories and vulnerability fixes
icon: media/icon.svg
strategy: polling
# Polling without a URL allows Serverless to perform exactly one selected API request.
polling_url: ''
polling_verb: GET
polling_headers: ''
serverless_language: node
refresh_interval: 360
no_screen_padding: 'no'
dark_mode: 'no'
framework_version: 3.4.6
custom_fields:
  - keyname: table_type
    name: Table to display
    field_type: select
    options:
      - 'Security Advisories': advisories
      - 'Security Vulnerabilities (NXVD)': nxvd
    default: advisories
    description: Select Nutanix data source
    conditional_validation:
      - when: advisories
        visible:
          - advisory_sort
      - when: nxvd
        visible:
          - nxvd_product
  - keyname: advisory_sort
    name: Advisory order
    field_type: select
    options:
      - 'Latest first': latest
      - 'Highest criticality first': criticality
    default: latest
    optional: true
  - keyname: nxvd_product
    name: Product (NXVD)
    field_type: select
    options:
      - 'All products': all
      - 'AOS': aos
      - 'AHV': ahv
      - 'Prism': prism
      - 'Files': files
      - 'NDB': ndb
      - 'WitnessVM': witnessvm
      - 'Witness Service': witness_service
    default: all
    optional: true
  - keyname: author_bio
    name: About This Plugin
    field_type: author_bio
    category: programming,news
    description: >-
      Read the latest Nutanix Security Advisories or review released fixes from the
      Nutanix Vulnerability Database. Sort advisories by publication date or
      criticality, or filter fixes by product. This independent plugin uses public
      Nutanix data and refreshes every six hours by default.
    github_url: https://github.com/taichikuji/trmnl-nutanix-sec-plugin
    learn_more_url: https://github.com/taichikuji/trmnl-nutanix-sec-plugin/blob/main/TRMNL/README.md#setup
