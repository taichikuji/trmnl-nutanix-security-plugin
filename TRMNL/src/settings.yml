---
name: Nutanix Security
# Short descriptions for TRMNL's private plugin editor.
description: Nutanix security advisories & CVEs
icon: media/icon.svg
strategy: polling
# Polling without a URL allows Serverless to perform exactly one selected API request.
polling_url: ''
polling_verb: GET
polling_headers: ''
serverless_language: node
refresh_interval: 360
no_screen_padding: 'yes'
dark_mode: 'no'
framework_version: 3.4.6
custom_fields:
  - keyname: table_type
    name: Table to display
    field_type: select
    indexable: true
    options:
      - 'Security Advisories': advisories
      - 'Vulnerability Fixes': nxvd
    default: advisories
    description: Select Nutanix data source
    conditional_validation:
      - when: advisories
        visible:
          - advisory_sort
      - when: nxvd
        visible:
          - nxvd_product
  - keyname: advisory_sort
    name: Advisory order
    field_type: select
    options:
      - 'Latest first': latest
      - 'Highest criticality first': criticality
    default: latest
    optional: true
  - keyname: nxvd_product
    name: Product (NXVD)
    field_type: select
    options:
      - 'All products': all
      - 'AOS': aos
      - 'AHV': ahv
      - 'Prism': prism
      - 'Files': files
      - 'NDB': ndb
      - 'WitnessVM': witnessvm
      - 'Witness Service': witness_service
    default: all
    optional: true
  - keyname: author_bio
    name: About This Plugin
    field_type: author_bio
    category: programming,news
    description: >-
      Follow Nutanix security advisories on your TRMNL. See what Nutanix has published,
      how serious it is, and which software versions an advisory lists as affected.
      <br/><br/> Choose Security Advisories to see new notices or put the most critical
      ones first. Choose Vulnerability Fixes to use the plugin as a Nutanix CVE tracker.
      It shows a selection of released fixes from the Nutanix Vulnerability Database
      (NXVD), ranked by CVSS. Filter by product to focus on AOS, AHV, Prism, Files,
      NDB, or Witness.
      <br/><br/> Nutanix publishes the data. This independent plugin was created by
      Ivan Perez and requires no API key or access to your cluster. See which advisories
      and fixes are worth reviewing before your next patch window.
    github_url: https://github.com/taichikuji/trmnl-nutanix-security-plugin
    learn_more_url: https://github.com/taichikuji/trmnl-nutanix-security-plugin/tree/main/TRMNL#setup
