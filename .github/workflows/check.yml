name: Check plugin

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test schedule transform
        run: node --test TRMNL/tests/transform.test.cjs
      - name: Render and check layouts
        run: ./scripts/preview
      - name: Lint templates
        run: docker run --rm --volume "$PWD/TRMNL:/plugin" trmnl/trmnlp:v0.32.3 lint
      - name: Save previews and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previews
          path: TRMNL/_build/
